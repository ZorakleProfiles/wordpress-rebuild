<svg width="220" height="150" viewBox="0 0 220 150" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

  <!-- Grid rings -->
  <polygon points="110,53 131,68 123,93 97,93 89,68"   fill="none" stroke="#d1d4dd" stroke-width="1"/>
  <polygon points="110,37 146,63 132,107 88,107 74,63"  fill="none" stroke="#d1d4dd" stroke-width="1"/>
  <polygon points="110,20 162,58 142,120 78,120 58,58"  fill="none" stroke="#d1d4dd" stroke-width="1"/>

  <!-- Axis spokes -->
  <line x1="110" y1="75" x2="110" y2="20"  stroke="#d1d4dd" stroke-width="1"/>
  <line x1="110" y1="75" x2="162" y2="58"  stroke="#d1d4dd" stroke-width="1"/>
  <line x1="110" y1="75" x2="142" y2="120" stroke="#d1d4dd" stroke-width="1"/>
  <line x1="110" y1="75" x2="78"  y2="120" stroke="#d1d4dd" stroke-width="1"/>
  <line x1="110" y1="75" x2="58"  y2="58"  stroke="#d1d4dd" stroke-width="1"/>

  <!-- Required zone (dashed orange) -->
  <polygon points="110,31 154,61 134,109 85,110 73,63"
    fill="#fd7730" fill-opacity="0.07"
    stroke="#fd7730" stroke-width="1.5" stroke-dasharray="4 2.5"/>

  <!-- Candidate profile (green fill) -->
  <polygon points="110,26 137,66 136,112 95,97 68,61"
    fill="#09cc9c" fill-opacity="0.28"
    stroke="#09cc9c" stroke-width="2" stroke-linejoin="round"/>

  <!-- Axis tip dots -->
  <circle cx="110" cy="20"  r="2.5" fill="#c8ccd6"/>
  <circle cx="162" cy="58"  r="2.5" fill="#c8ccd6"/>
  <circle cx="142" cy="120" r="2.5" fill="#c8ccd6"/>
  <circle cx="78"  cy="120" r="2.5" fill="#c8ccd6"/>
  <circle cx="58"  cy="58"  r="2.5" fill="#c8ccd6"/>

  <!-- Center anchor -->
  <circle cx="110" cy="75" r="3" fill="#09cc9c"/>

  <!-- Legend (centered at x=110; total width ≈144px so start=38) -->
  <line x1="38" y1="141" x2="52" y2="141" stroke="#fd7730" stroke-width="1.5" stroke-dasharray="4 2.5"/>
  <text x="55" y="144" font-size="7.5" font-family="sans-serif" fill="#3b3e47">Required</text>
  <rect x="100" y="136" width="9" height="9" rx="2"
    fill="#09cc9c" fill-opacity="0.30" stroke="#09cc9c" stroke-width="1.5"/>
  <text x="112" y="144" font-size="7.5" font-family="sans-serif" fill="#3b3e47">Candidate profile</text>

</svg>

