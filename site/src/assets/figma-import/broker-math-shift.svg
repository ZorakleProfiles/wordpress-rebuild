<svg viewBox="0 0 760 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Why SpotOn! Match beats guesswork</title>
  <desc id="desc">A simple flow showing guesswork creates friction, while SpotOn! Match delivers confidence and a better broker and client experience.</desc>

  <g transform="translate(12,12)">
    <rect x="0" y="0" width="356" height="496" rx="24" fill="#FFE9E9" stroke="#F1C7C7" />
    <rect x="380" y="0" width="356" height="496" rx="24" fill="#E8FBF4" stroke="#BFE9DC" />

    <text x="28" y="50" font-size="26" font-weight="700" fill="#8F2020" font-family="Inter, Arial, sans-serif">Guesswork = Risk</text>
    <text x="28" y="84" font-size="16" fill="#A94444" font-family="Inter, Arial, sans-serif">Unclear recommendations</text>
    <text x="28" y="108" font-size="16" fill="#A94444" font-family="Inter, Arial, sans-serif">More client friction</text>

    <g transform="translate(28,132)">
      <circle cx="8" cy="8" r="8" fill="#E94949" />
      <path d="M4.5 8H11.5" stroke="#FFF" stroke-width="2" stroke-linecap="round" />
      <text x="24" y="12" font-size="14" fill="#723C3C" font-family="Inter, Arial, sans-serif">Decisions slow down</text>
    </g>
    <g transform="translate(28,166)">
      <circle cx="8" cy="8" r="8" fill="#E94949" />
      <path d="M4.5 8H11.5" stroke="#FFF" stroke-width="2" stroke-linecap="round" />
      <text x="24" y="12" font-size="14" fill="#723C3C" font-family="Inter, Arial, sans-serif">Client trust is harder to build</text>
    </g>

    <text x="408" y="50" font-size="26" font-weight="700" fill="#0D7258" font-family="Inter, Arial, sans-serif">SpotOn! Match</text>
    <text x="408" y="84" font-size="16" fill="#2F816D" font-family="Inter, Arial, sans-serif">Clear, confidence-backed guidance</text>
    <text x="408" y="108" font-size="16" fill="#2F816D" font-family="Inter, Arial, sans-serif">Faster, better client experience</text>

    <g transform="translate(408,132)">
      <circle cx="8" cy="8" r="8" fill="#09CC9C" />
      <path d="M4.5 8L6.7 10.3L11.5 5.3" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="24" y="12" font-size="14" fill="#275F52" font-family="Inter, Arial, sans-serif">Stronger conversations</text>
    </g>
    <g transform="translate(408,166)">
      <circle cx="8" cy="8" r="8" fill="#09CC9C" />
      <path d="M4.5 8L6.7 10.3L11.5 5.3" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="24" y="12" font-size="14" fill="#275F52" font-family="Inter, Arial, sans-serif">Better-fit outcomes over time</text>
    </g>
