<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fit clarity impact on outcomes</title>
  <desc id="desc">Two diverging paths showing owner earnings and support cost over time, comparing low fit versus high fit scenarios.</desc>

  <!-- Left path: Low fit (declining) -->
  <g transform="translate(80, 80)">
    <!-- Earnings line (flat/declining) -->
    <path d="M 10 200 Q 60 190 110 180 Q 160 170 210 160"
          stroke="#fd7730" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Support cost line (rising) -->
    <path d="M 10 100 Q 60 90 110 60 Q 160 30 210 10"
          stroke="#e94949" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Start points -->
    <circle cx="10" cy="100" r="6" fill="#fd7730" opacity="0.6"/>
    <circle cx="10" cy="200" r="6" fill="#e94949" opacity="0.6"/>

    <!-- Label -->
    <text x="110" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#22252a" font-family="Inter, Arial, sans-serif">Without clarity</text>
  </g>

  <!-- Right path: High fit (diverging) -->
  <g transform="translate(420, 80)">
    <!-- Earnings line (rising) -->
    <path d="M 10 200 Q 60 160 110 100 Q 160 40 210 20"
          stroke="#09cc9c" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Support cost line (declining) -->
    <path d="M 10 100 Q 60 110 110 130 Q 160 150 210 160"
          stroke="#e94949" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Start points -->
    <circle cx="10" cy="100" r="6" fill="#e94949" opacity="0.6"/>
    <circle cx="10" cy="200" r="6" fill="#09cc9c" opacity="0.6"/>

    <!-- Label -->
    <text x="110" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#22252a" font-family="Inter, Arial, sans-serif">With clarity</text>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 360)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#09cc9c" stroke-width="4" stroke-linecap="round"/>
    <text x="30" y="5" font-size="12" fill="#22252a" font-family="Inter, Arial, sans-serif">Earnings</text>

    <line x1="150" y1="0" x2="170" y2="0" stroke="#e94949" stroke-width="4" stroke-linecap="round"/>
    <text x="180" y="5" font-size="12" fill="#22252a" font-family="Inter, Arial, sans-serif">Support cost</text>
  </g>
</svg>

